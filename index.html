<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Isekai Prototype</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0a10; --bg2:#15121c; --ink:#efe6d2; --dim:#9b927f; --gold:#d9b25f; --gold2:#8a6a2c;
  --hp:#c0453a; --hp2:#7a2620; --pm:#5aa5d8; --brk:#e8b23b; --ok:#6fcf8f;
  --feu:#e8743b; --glace:#6cc4e8; --foudre:#f2d64b; --lumiere:#fff2b0; --ombre:#9a6bd6; --phys:#cfc7b4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:520px;height:100%;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:2}
.screen.on{display:flex}
h1,h2{font-weight:normal;letter-spacing:.12em;text-align:center;margin:0}
.title{color:var(--gold);font-size:1.4rem;padding:20px 16px 4px;text-shadow:0 0 18px rgba(217,178,95,.45)}
.sub{color:var(--dim);text-align:center;font-size:.88rem;padding:0 22px 10px;font-style:italic;margin:0}
button{font-family:inherit;color:var(--ink);background:linear-gradient(#2a2234,#1a1522);border:1px solid var(--gold2);
  border-radius:8px;padding:11px 10px;font-size:1rem;cursor:pointer;transition:transform .08s,border-color .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
button.gold{border-color:var(--gold);box-shadow:0 0 14px rgba(217,178,95,.25)}
input[type=text]{font-family:inherit;font-size:1.1rem;color:var(--ink);background:#1a1522;border:1px solid var(--gold2);border-radius:8px;padding:12px;text-align:center;width:100%;user-select:text}

/* ===== naissance ===== */
#birth{background:radial-gradient(120% 70% at 50% 0%,#2a2236 0%,var(--bg) 62%)}
#nameBox{display:flex;flex-direction:column;gap:10px;padding:10px 24px}
#sheet{flex:1;overflow-y:auto;padding:4px 14px 8px;display:flex;flex-direction:column;gap:9px;min-height:0}
.bcard{border:1px solid var(--gold2);border-radius:10px;padding:10px 12px;background:rgba(21,18,28,.9);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;flex:none}
.bcard.show{opacity:1;transform:none}
.bcard small{color:var(--dim);display:block;letter-spacing:.1em;text-transform:uppercase;font-size:.68rem;margin-bottom:3px}
.bcard .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:.9rem}
.bcard .row span:first-child{color:var(--dim)}
.bcard .row span:last-child{text-align:right}
.bcard .desc{color:var(--dim);font-size:.78rem;margin:2px 0 0}
.stat{display:grid;grid-template-columns:92px 1fr 26px;gap:8px;align-items:center;font-size:.82rem;padding:2px 0}
.stat .bar{margin:0;height:8px}
.stat b{font-weight:normal;text-align:right}
.rar-commun{color:#cfc7b4}.rar-rare{color:#6cc4e8}.rar-epique{color:#c78bf0}.rar-legendaire{color:#f2b84b;text-shadow:0 0 10px #f2b84b}.rar-maudit{color:#e0554a}
.pos{color:var(--ok)}.neg{color:#e0877c}
.grade{font-size:2.2rem;color:var(--gold);text-align:center;letter-spacing:.2em;text-shadow:0 0 16px rgba(217,178,95,.6)}
#birthBtns{display:flex;flex-direction:column;gap:8px;padding:8px 14px calc(14px);flex:none}
#birthSprite{height:130px;display:none;justify-content:center;flex:none}
#birthSprite svg{height:130px}

/* ===== combat ===== */
#battle{background:var(--bg)}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;
  background:
   radial-gradient(60% 40% at 72% 22%,rgba(217,178,95,.20),transparent 70%),
   linear-gradient(#1b1626 0%,#241c30 46%,#120f19 46.2%,#0b0a10 100%)}
#scene::before{content:"";position:absolute;left:-10%;right:-10%;top:46%;height:2px;background:linear-gradient(90deg,transparent,rgba(217,178,95,.4),transparent)}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
.platform{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(70,56,90,.7),rgba(30,24,40,.0) 72%)}
#top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:.78rem;color:var(--dim);z-index:7}
#wave{letter-spacing:.14em;text-transform:uppercase}
#pm{display:flex;align-items:center;gap:3px}
#pm i{width:11px;height:11px;border-radius:50%;border:1px solid var(--pm);display:inline-block}
#pm i.on{background:var(--pm);box-shadow:0 0 8px var(--pm)}
.unit{position:absolute;text-align:center;z-index:3;transition:transform .22s,opacity .6s,filter .3s}
.unit svg{display:block;width:100%;height:auto;overflow:visible;animation:bob 2.4s ease-in-out infinite}
.unit.ally{width:86px}
.unit.enemy{width:96px}
.unit.enemy.boss{width:150px}
@keyframes bob{50%{transform:translateY(-4px)}}
.plate{position:absolute;left:50%;transform:translateX(-50%);min-width:86px;background:rgba(10,8,14,.82);border:1px solid #3a3342;border-radius:6px;padding:2px 6px 4px;font-size:.7rem;white-space:nowrap;pointer-events:none}
.unit.enemy .plate{top:-30px}
.unit.ally .plate{bottom:-34px}
.plate .bar{height:6px;margin:2px 0 0}
.plate .brk{height:4px;margin-top:2px}
.bar{height:7px;background:#000;border:1px solid #3a3342;border-radius:4px;overflow:hidden;margin:4px 0 0}
.bar>div{height:100%;transition:width .35s}
.hp>div{background:linear-gradient(90deg,var(--hp2),var(--hp))}
.brk>div{background:linear-gradient(90deg,#7c5a14,var(--brk))}
.unit.broken svg{filter:grayscale(1) drop-shadow(0 0 10px var(--brk));transform:rotate(-8deg)}
.unit.dead{opacity:0;transform:translateY(20px) scale(.9);pointer-events:none}
.unit.down svg{filter:grayscale(1);opacity:.4}
.unit.enemy.lunge{transform:translate(-34px,28px) scale(1.1)}
.unit.ally.lunge{transform:translate(38px,-24px) scale(1.08)}
.unit .arrow{position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:1.1rem;display:none;text-shadow:0 0 8px var(--gold);animation:bob 1s infinite}
.unit.active .arrow{display:block}
.targetable{cursor:pointer}
.targetable::before{content:"";position:absolute;left:-6px;right:-6px;top:-8px;bottom:-8px;border:2px dashed var(--gold);border-radius:12px;animation:pulse 1s infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.25}}
.unit.targeted svg{filter:drop-shadow(0 0 10px var(--hp))}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:1.4rem;letter-spacing:.2em;color:var(--gold);
  text-shadow:0 0 20px rgba(0,0,0,.9),0 0 18px rgba(217,178,95,.6);opacity:0;pointer-events:none;z-index:9;transition:opacity .3s}
#banner.on{opacity:1}
.float{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:1.35rem;font-weight:bold;pointer-events:none;text-shadow:0 2px 6px #000;animation:fl 1s forwards;z-index:8;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-46px);opacity:0}}
.shake{animation:shk .3s}
@keyframes shk{20%{margin-left:-6px}40%{margin-left:6px}60%{margin-left:-4px}80%{margin-left:3px}}
.flash{animation:fls .35s}
@keyframes fls{0%{background:rgba(192,69,58,.45)}100%{background:transparent}}

/* panneau du bas */
#panel{flex:none;display:grid;grid-template-columns:1.12fr 1fr;gap:8px;padding:8px;background:linear-gradient(#181320,#0f0c15);border-top:2px solid var(--gold2);
  height:262px}
#left{display:flex;flex-direction:column;gap:6px;min-height:0}
#msg{flex:none;height:62px;border:1px solid var(--gold2);border-radius:8px;padding:7px 9px;font-size:.82rem;line-height:1.25;background:rgba(0,0,0,.35);overflow:hidden}
#status{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0}
.srow{flex:1;border:1px solid #3a3342;border-radius:7px;padding:3px 8px;background:rgba(21,18,28,.9);display:flex;flex-direction:column;justify-content:center;font-size:.78rem;min-height:0}
.srow .l1{display:flex;justify-content:space-between}
.srow .l1 i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.srow .bar{height:6px;margin:3px 0 0}
.srow .nums{display:flex;justify-content:space-between;font-size:.68rem;color:var(--dim)}
.srow .sh{color:var(--glace)}
.srow.active{border-color:var(--gold);box-shadow:0 0 10px rgba(217,178,95,.35)}
.srow.down{opacity:.35}
.srow.targetable{border-style:dashed;border-color:var(--gold)}
.srow.targetable::before{display:none}
#cmd{display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto}
#cmd button{text-align:left;padding:9px 11px;font-size:.95rem;flex:none}
#cmd button.sm{min-height:44px;padding:6px 9px}
#cmd button b{display:block;font-weight:normal;font-size:.9rem}
#cmd button span{font-size:.68rem;color:var(--dim);display:block;line-height:1.15}
#cmd button .c{float:right;color:var(--pm);font-size:.8rem}
#cmd .head{font-size:.72rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;flex:none}
#cmd .back{background:transparent;border-color:#3a3342;color:var(--dim);padding:7px 10px;font-size:.85rem;text-align:center}
.menu-main button{flex:1}

/* esquive */
#dodge{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,4,8,.6);touch-action:manipulation}
#dodge.on{display:flex}
#dodgeInfo{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:1rem;letter-spacing:.06em;padding:0 20px}
#dodgeInfo em{color:var(--gold);font-style:normal}
#dodgeHint{position:absolute;bottom:22%;left:0;right:0;text-align:center;color:var(--dim);font-size:.85rem}
#ringWrap{position:relative;width:220px;height:220px}
#target{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 20px rgba(217,178,95,.5),inset 0 0 12px rgba(217,178,95,.3)}
#ring{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px;border-radius:50%;border:4px solid var(--ink);opacity:.9}
#dodgeRes{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:2rem;letter-spacing:.2em;transform:translateY(-50%);pointer-events:none;text-shadow:0 0 14px #000}

/* fin */
#end{align-items:center;justify-content:center;gap:14px;background:rgba(5,4,8,.9);z-index:30}
#end h2{font-size:2rem;color:var(--gold)}
#end p{color:var(--dim);margin:0;padding:0 24px;text-align:center}
#settings{position:absolute;left:12px;top:28px;z-index:7;font-size:.7rem;color:var(--dim);display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="app">

<!-- NAISSANCE -->
<section id="birth" class="screen on">
  <h1 class="title">RÉINCARNATION</h1>
  <p class="sub" id="birthSub">Tu fermes les yeux. Une lumière froide t'enveloppe. Tu ne choisiras ni ta race, ni ta magie, ni ton destin. Seulement ton nom.</p>
  <div id="nameBox">
    <input type="text" id="nameIn" maxlength="14" placeholder="Ton nom dans l'autre monde" autocomplete="off">
  </div>
  <div id="birthSprite"></div>
  <div id="sheet"></div>
  <div id="birthBtns">
    <button class="gold" id="btnRoll">Naître dans l'autre monde</button>
    <button class="gold" id="btnStart" style="display:none">Avoir 18 ans : premier combat</button>
    <button id="btnNew" style="display:none;font-size:.8rem;color:var(--dim)">Nouvelle naissance (réservé aux tests)</button>
  </div>
</section>

<!-- COMBAT -->
<section id="battle" class="screen">
  <div id="scene">
    <div id="top"><span id="wave"></span><span id="pm"></span></div>
    <div id="settings"><label><input type="checkbox" id="easy"> mode facile</label></div>
    <div id="banner"></div>
  </div>
  <div id="panel">
    <div id="left"><div id="msg"></div><div id="status"></div></div>
    <div id="cmd"></div>
  </div>
  <div id="dodge">
    <div id="dodgeInfo"></div>
    <div id="ringWrap"><div id="target"></div><div id="ring"></div></div>
    <div id="dodgeRes"></div>
    <div id="dodgeHint">Touche l'écran quand l'anneau touche le cercle doré</div>
  </div>
</section>

<section id="end" class="screen">
  <h2 id="endT"></h2><p id="endP"></p>
  <button class="gold" id="btnAgain" style="min-width:220px">Rejouer le combat</button>
</section>

</div>
<script>

function rollBirth(name){
  const race=wpick(RACES),place=wpick(PLACES),fam=wpick(FAMILIES),god=wpick(GODS);
  const traitPool=[...TRAITS].sort(()=>Math.random()-.5);
  const nt=Math.random()<.3?3:2;const traits=traitPool.slice(0,nt).map(t=>t.n);
  const cursed=Math.random()<.07;
  const cr=wpick(Object.entries(CHEAT_R).map(([id,v])=>({id,w:v.w})));
  const cheat=pick(CHEATS.filter(c=>c.r===cr.id));
  const base={};STATS.forEach(([k])=>base[k]=6+rint(0,6)+rint(0,6));
  const aff={};ELS.forEach(e=>aff[e]=rint(0,38));
  const main=pick(ELS);aff[main]=rint(52,100);
  const sec=pick(ELS.filter(e=>e!==main));aff[sec]=Math.max(aff[sec],rint(30,60));
  return{v:2,name:(name||"").trim()||"Voyageur",race:race.id,place:place.id,fam:fam.id,god:god.id,traits,cursed,cheat:cheat.id,
    base,aff,hair:pick(HAIR),eyes:pick(EYES),sib:rint(0,SIB.length-1),seed:Date.now()};
}
const byId=(a,id)=>a.find(x=>x.id===id);
const byName=(a,n)=>a.find(x=>x.n===n);
/* applique toutes les sources de bonus */
function computeChar(b){
  const race=byId(RACES,b.race),place=byId(PLACES,b.place),fam=byId(FAMILIES,b.fam),god=byId(GODS,b.god),cheat=byId(CHEATS,b.cheat);
  const sources=[race,place,fam,god,...b.traits.map(n=>byName(TRAITS,n))];if(b.cursed)sources.push(CURSE);
  const st={};STATS.forEach(([k])=>st[k]=b.base[k]);
  const aff={...b.aff};
  sources.forEach(s=>{for(const k in (s.delta||{}))st[k]+=s.delta[k];for(const e in (s.elb||{}))aff[e]=(aff[e]||0)+s.elb[e]});
  STATS.forEach(([k])=>st[k]=clamp(st[k],1,30));ELS.forEach(e=>aff[e]=clamp(aff[e],0,100));
  const total=STATS.reduce((s,[k])=>s+st[k],0);
  const top=Math.max(...ELS.map(e=>aff[e]));
  const score=total+top/5+CHEAT_R[cheat.r].s+(b.cursed?8:0);
  const grade=score<98?"D":score<108?"C":score<118?"B":score<130?"A":score<142?"S":"SS";
  return{race,place,fam,god,cheat,st,aff,total,score,grade,gold:fam.gold};
}

let AC=null;
function tone(f,d=.1,type="sine",v=.07,slide=0){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={hit:()=>tone(160,.15,"sawtooth",.09,-90),parry:()=>{tone(880,.12,"triangle",.09);setTimeout(()=>tone(1320,.2,"triangle",.07),70)},
  dodge:()=>tone(520,.12,"sine",.06,200),hurt:()=>tone(110,.25,"square",.08,-60),heal:()=>{tone(520,.1);setTimeout(()=>tone(780,.18),90)},
  brk:()=>{tone(200,.3,"sawtooth",.1,-120);setTimeout(()=>tone(100,.4,"square",.1),120)},tick:()=>tone(700,.05,"triangle",.04),crit:()=>{tone(1000,.08,"square",.06);setTimeout(()=>tone(1500,.15,"square",.05),60)}};

}
function loadWave(){
  const sc=$("#scene");sc.querySelectorAll(".unit.enemy").forEach(e=>e.remove());
  S.enemies=WAVES[S.wave].map(k=>({...BEST[k],key:k,maxHp:BEST[k].hp,hp:BEST[k].hp,brk:0,broken:false}));
  const pos=ENEMY_POS[S.enemies.length];
  S.enemies.forEach((e,i)=>{
    const p=pos[i];const d=document.createElement("div");d.className="unit enemy"+(e.boss?" boss":"");d.id="ue"+i;
    d.style.cssText="right:"+p.r+"%;top:"+p.t+"%";
    d.innerHTML=ENEMY_SVG[e.key]+"<div class='plate'><div>"+e.name+"</div><div class='bar hp'><div></div></div><div class='bar brk'><div></div></div></div>";
    sc.appendChild(d)});
  $("#wave").textContent="Vague "+(S.wave+1)+" / "+WAVES.length;
  renderAll();
}
function renderAll(){renderPm();renderUnits();renderStatus()}
function renderPm(){const p=$("#pm");p.innerHTML="Énergie ";for(let i=0;i<9;i++)p.innerHTML+="<i class='"+(i<S.pm?"on":"")+"'></i>"}
function renderUnits(){
  S.enemies.forEach((e,i)=>{const d=$("#ue"+i);if(!d)return;
    d.classList.toggle("dead",e.hp<=0);d.classList.toggle("broken",e.broken);
    const bars=d.querySelectorAll(".plate .bar>div");bars[0].style.width=(100*e.hp/e.maxHp)+"%";bars[1].style.width=Math.min(100,e.brk)+"%"});
  S.party.forEach((a,i)=>{const d=$("#ua"+i);d.classList.toggle("down",a.hp<=0);d.classList.toggle("active",S.active===a)});
}
function renderStatus(){
  const box=$("#status");box.innerHTML="";
  S.party.forEach((a,i)=>{
    const d=document.createElement("div");d.className="srow"+(a.hp<=0?" down":"")+(S.active===a?" active":"");d.id="sr"+i;
    d.innerHTML="<div class='l1'><span><i style='background:var(--"+a.el+")'></i>"+a.name+"</span><span class='sh'>"+(a.shield?"🛡"+a.shield:"")+"</span></div>"+
      "<div class='bar hp'><div style='width:"+(100*Math.max(0,a.hp)/a.maxHp)+"%'></div></div><div class='nums'><span>PV</span><span>"+Math.max(0,a.hp)+" / "+a.maxHp+"</span></div>";
    box.appendChild(d)});
}
function floatText(unitId,text,color){
  const el=$(unitId);if(!el)return;const f=document.createElement("div");f.className="float";f.textContent=text;f.style.color=color||"#fff";
  el.appendChild(f);setTimeout(()=>f.remove(),1000)}
function shake(id){const el=$(id);if(!el)return;el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),300)}
async function lunge(id){const el=$(id);el.classList.add("lunge");await sleep(240);el.classList.remove("lunge")}

async function loop(){
  const hero=S.party[0];
  while(!S.over){
    S.round++;
    if(S.round>1){S.pm=Math.min(9,S.pm+1+(hero.cheat==="flux"?1:0)+(hero.esp>=19?1:0));
      if(hero.cheat==="regen"&&hero.hp>0){const h=Math.round(hero.maxHp*.05);hero.hp=Math.min(hero.maxHp,hero.hp+h);floatText("#ua0","+"+h,"var(--ok)")}}
    renderAll();
    await banner("Ton tour",700);
    for(let i=0;i<S.party.length;i++){
      const a=S.party[i];
      if(a.hp<=0)continue;
      if(!alive(S.enemies).length)break;
      S.active=a;S.guard[a.id]=0;renderAll();
      const act=await chooseAction(a);
      await perform(a,act);
      if(!alive(S.enemies).length)break;
    }
    S.active=null;renderAll();
    if(!alive(S.enemies).length){
      if(S.wave<WAVES.length-1){
        S.wave++;await banner("Vague terminée",1000);
        S.party.forEach(a=>{if(a.hp>0)a.hp=Math.min(a.maxHp,a.hp+Math.round(a.maxHp*.3));a.shield=0});
        S.pm=Math.min(9,S.pm+2);loadWave();S.round=0;await banner("Un gardien approche...",1400);continue;
      }
      return end(true);
    }
    await banner("Tour ennemi",800);
    await enemyPhase();
    if(!alive(S.party).length)return end(false);
  }
}
function end(win){
  S.over=true;
  setTimeout(()=>{show("end");
    $("#endT").textContent=win?"VICTOIRE":"DÉFAITE";
    $("#endP").textContent=win?"Le gardien est tombé. Ce n'est que le début de ton histoire.":"Tu t'effondres. Dans ce monde, la mort est aussi une histoire.";
  },800);
}

/* ---- menu de commandes (style Pokémon / Final Fantasy) ---- */
function chooseAction(actor){
  return new Promise(res=>{
    const cmd=$("#cmd");
    function clearTargets(){document.querySelectorAll(".targetable").forEach(e=>{e.classList.remove("targetable");e.onclick=null})}
    function done(a){clearTargets();cmd.innerHTML="";res(a)}
    function btn(label,sub,cost,fn,dis,cls){const b=document.createElement("button");if(cls)b.className=cls;
      b.innerHTML="<b>"+label+(cost!==undefined?"<span class='c'>"+cost+"</span>":"")+"</b>"+(sub?"<span>"+sub+"</span>":"");b.disabled=!!dis;b.onclick=fn;cmd.appendChild(b);return b}
    function head(t){const h=document.createElement("div");h.className="head";h.textContent=t;cmd.appendChild(h)}
    function mainMenu(){
      clearTargets();cmd.innerHTML="";cmd.className="menu-main";
      msg("Que doit faire "+actor.name+" ?");
      btn("Attaque","",undefined,()=>useSkill(actor.skills[0]));
      btn("Compétences","",undefined,skillMenu);
      btn("Objets","",undefined,itemMenu);
      btn("Défense","Bouclier 20, +1 énergie",undefined,()=>done({kind:"guard"}));
    }
    function skillMenu(){
      clearTargets();cmd.innerHTML="";cmd.className="";head("Compétences");
      actor.skills.slice(1).forEach(s=>btn(s.n,s.d,s.cost+" ⚡",()=>useSkill(s),s.cost>S.pm,"sm"));
      btn("← Retour","",undefined,mainMenu,false,"back");
      msg("Choisis une compétence. Énergie : "+S.pm+".");
    }
    function itemMenu(){
      clearTargets();cmd.innerHTML="";cmd.className="";head("Objets");
      S.items.forEach(it=>btn(it.n+" ×"+it.qty,it.d,undefined,()=>useItem(it),it.qty<=0,"sm"));
      btn("← Retour","",undefined,mainMenu,false,"back");msg("Choisis un objet.");
    }
    function useSkill(s){
      if(s.cost>S.pm)return;
      if(s.t==="all"||s.t==="self"||s.t==="allies")return done({kind:"skill",skill:s});
      if(s.t==="enemy")return target(alive(S.enemies).map(e=>[e,"#ue"+S.enemies.indexOf(e)]),"Choisis un ennemi.",t=>done({kind:"skill",skill:s,target:t}));
      target(alive(S.party).map(a=>[a,"#ua"+S.party.indexOf(a),"#sr"+S.party.indexOf(a)]),"Choisis un allié.",t=>done({kind:"skill",skill:s,target:t}));
    }
    function useItem(it){
      if(it.t==="none")return done({kind:"item",item:it});
      const list=it.t==="down"?S.party.filter(a=>a.hp<=0):alive(S.party);
      if(!list.length){msg("Personne n'a besoin de cet objet.");return}
      target(list.map(a=>[a,"#ua"+S.party.indexOf(a),"#sr"+S.party.indexOf(a)]),"Choisis un allié.",t=>done({kind:"item",item:it,target:t}));
    }
    function target(list,text,cb){
      clearTargets();msg(text);
      cmd.innerHTML="";head("Cible");btn("← Annuler","",undefined,mainMenu,false,"back");
      list.forEach(([u,...sels])=>sels.forEach(s=>{const el=$(s);el.classList.add("targetable");el.onclick=()=>cb(u)}));
    }
    mainMenu();
  });
}

/* ---- exécution ---- */
const enemyIndex=e=>S.enemies.indexOf(e);
function critRoll(a){return Math.random()<(a.crit||0)}
function addBreak(e,n){e.brk+=n;if(e.brk>=100&&!e.broken&&e.hp>0){e.broken=true;e.brk=100;sfx.brk();return true}return false}
async function perform(actor,act){
  const ai=S.party.indexOf(actor);
  if(act.kind==="guard"){
    S.pm=Math.min(9,S.pm+1);actor.shield+=20;renderAll();sfx.dodge();floatText("#ua"+ai,"🛡20","var(--glace)");msg(actor.name+" se met en garde.");await sleep(700);return}
  if(act.kind==="item"){
    const it=act.item;it.qty--;
    if(it.id==="potion"){const t=act.target;t.hp=Math.min(t.maxHp,t.hp+60);floatText("#ua"+S.party.indexOf(t),"+60","var(--ok)");msg(actor.name+" utilise une Potion sur "+t.name+".")}
    if(it.id==="ether"){S.pm=Math.min(9,S.pm+3);msg(actor.name+" boit un Éther (+3 énergie).")}
    if(it.id==="plume"){const t=act.target;t.hp=Math.round(t.maxHp*.5);msg(actor.name+" relève "+t.name+" !");floatText("#ua"+S.party.indexOf(t),"Relevé","var(--ok)")}
    sfx.heal();renderAll();await sleep(800);return}
  const skill=act.skill,target=act.target;
  S.pm=Math.min(9,S.pm-skill.cost+(skill.cost===0?1:0));renderPm();
  await lunge("#ua"+ai);
  if(skill.heal){
    const t=target;const amt=Math.round(skill.heal*actor.mag);t.hp=Math.min(t.maxHp,t.hp+amt);
    sfx.heal();msg(actor.name+" soigne "+t.name+" (+"+amt+").");renderAll();floatText("#ua"+S.party.indexOf(t),"+"+amt,"var(--ok)");await sleep(700);return}
  if(skill.shield){
    const list=skill.t==="self"?[actor]:alive(S.party);
    list.forEach(t=>{t.shield+=skill.shield;floatText("#ua"+S.party.indexOf(t),"🛡"+skill.shield,"var(--glace)")});
    sfx.dodge();msg(actor.name+" lève un bouclier.");renderAll();await sleep(700);return}
  const targets=skill.t==="all"?alive(S.enemies):[target];
  const hero=S.party[0];
  for(const e of targets){
    let mult=1,txt="";
    if(e.weak===skill.el){mult=1.5*(hero.cheat==="oeil"?1.15:1);addBreak(e,35);txt=" Point faible !"}
    else if(e.resist===skill.el){mult=.6;e.brk+=5;txt=" Résisté."}
    else e.brk+=10;
    if(skill.cost>=3)e.brk+=10;
    if(skill.brk)e.brk+=skill.brk;
    if(actor.affMult&&skill.el!=="phys")mult*=actor.affMult(skill.el);
    if(e.broken)mult*=1.5;
    let crit=false;if(critRoll(actor)){mult*=1.5;crit=true;txt+=" Critique !"}
    const dmg=Math.max(1,Math.round(actor[skill.stat]*skill.power*mult*rnd(.9,1.1)));
    e.hp=Math.max(0,e.hp-dmg);
    const id="#ue"+enemyIndex(e);shake(id);
    floatText(id,(crit?"★ ":"")+dmg,crit?"var(--gold)":"var(--"+skill.el+")");crit?sfx.crit():sfx.hit();
    msg(actor.name+" : "+skill.n+", "+dmg+" dégâts."+txt);
    if(e.brk>=100&&!e.broken&&e.hp>0){e.broken=true;e.brk=100;sfx.brk();renderAll();await banner("BRISÉ !",700)}
    renderAll();
    if(e.hp<=0){msg(e.name+" est vaincu.");if(hero.cheat==="absorption"&&hero.hp>0){hero.hp=Math.min(hero.maxHp,hero.hp+Math.round(hero.maxHp*.2));floatText("#ua0","+","var(--ok)")}}
    renderAll();
  }
  await sleep(600);
}

/* ---- phase ennemie + esquive ---- */
async function enemyPhase(){
  const hero=S.party[0];
  for(let i=0;i<S.enemies.length;i++){
    const e=S.enemies[i];if(e.hp<=0)continue;
    if(e.broken){msg(e.name+" est brisé et ne peut pas attaquer.");await sleep(900);e.broken=false;e.brk=0;renderAll();continue}
    for(let h=0;h<e.hits;h++){
      const targets=alive(S.party);if(!targets.length)return;
      const t=pick(targets);const ti=S.party.indexOf(t);
      $("#ua"+ti).classList.add("targeted");
      msg(e.name+" attaque "+t.name+(e.hits>1?" ("+(h+1)+"/"+e.hits+")":"")+" !");
      await lunge("#ue"+i);
      const r=await dodgeGame(e,t);
      $("#ua"+ti).classList.remove("targeted");
      let dmg=Math.round(e.atk*rnd(.9,1.1)*(1-t.def/100));
      if(r==="parry"){
        sfx.parry();floatText("#ua"+ti,"PARADE","var(--gold)");
        const c=Math.round(t.atk*.8);e.hp=Math.max(0,e.hp-c);S.pm=Math.min(9,S.pm+1);
        const b=addBreak(e,20);floatText("#ue"+i,c,"var(--phys)");msg(t.name+" pare et riposte : "+c+" dégâts !");
        if(e.hp<=0&&hero.cheat==="absorption"&&hero.hp>0)hero.hp=Math.min(hero.maxHp,hero.hp+Math.round(hero.maxHp*.2));
        renderAll();
      }else{
        if(r==="dodge"){dmg=Math.round(dmg*.35);sfx.dodge()}else{sfx.hurt();$("#app").classList.add("flash");setTimeout(()=>$("#app").classList.remove("flash"),350)}
        let absorbed=0;if(t.shield){absorbed=Math.min(t.shield,dmg);t.shield-=absorbed;dmg-=absorbed}
        t.hp=Math.max(0,t.hp-dmg);
        floatText("#ua"+ti,dmg>0?"-"+dmg:(absorbed?"🛡":"0"),r==="dodge"?"var(--glace)":"var(--hp)");
        shake("#ua"+ti);
        if(t.hp<=0&&t.cheat==="boucle"&&!S.revived){S.revived=true;t.hp=Math.round(t.maxHp*.5);floatText("#ua"+ti,"Boucle !","var(--gold)");msg("La boucle temporelle te ramène à la vie !")}
        else if(t.hp<=0)msg(t.name+" s'effondre...");
      }
      renderAll();await sleep(650);
      if(e.hp<=0)break;
    }
  }
}
function dodgeGame(enemy,target){
  return new Promise(res=>{
    const box=$("#dodge"),ring=$("#ring"),resEl=$("#dodgeRes");
    const bonus=((target.agi||12)-12);
    const perfect=(easy()?170:90)+bonus*4,good=(easy()?340:210)+bonus*8;
    $("#dodgeInfo").innerHTML="<em>"+enemy.name+"</em> attaque <em>"+target.name+"</em>";
    resEl.textContent="";ring.style.transition="none";ring.style.transform="scale(1)";ring.style.opacity=".9";
    box.classList.add("on");
    const dur=enemy.speed*(easy()?1.25:1),prep=450;
    let start=0,finished=false;
    function finish(r){
      if(finished)return;finished=true;
      document.removeEventListener("keydown",onKey);box.onpointerdown=null;
      resEl.textContent=r==="parry"?"PARADE !":r==="dodge"?"ESQUIVE":"RATÉ";
      resEl.style.color=r==="parry"?"var(--gold)":r==="dodge"?"var(--glace)":"var(--hp)";
      setTimeout(()=>{box.classList.remove("on");res(r)},380);
    }
    function tap(){
      if(!start)return;
      const d=Math.abs(performance.now()-(start+dur));
      finish(d<=perfect?"parry":d<=good?"dodge":"miss");
    }
    const onKey=ev=>{if(ev.code==="Space"||ev.key==="Enter"){ev.preventDefault();tap()}};
    document.addEventListener("keydown",onKey);box.onpointerdown=tap;
    setTimeout(()=>{
      start=performance.now();
      ring.style.transition="transform "+dur+"ms linear";ring.style.transform="scale("+(70/220)+")";
      setTimeout(()=>{ring.style.opacity=".35"},dur);
      setTimeout(()=>finish("miss"),dur+good+30);
    },prep);
  });
}
</script>
